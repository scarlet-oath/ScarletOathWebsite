name: CI

on:
    push:
        branches:
            - core
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: npm
            - name: Check Node version
              run: npm run check:node
            - name: Install dependencies
              run: npm ci
            - name: Check formatting
              run: npm run format:check
            - name: Lint
              run: npm run lint
            - name: Typecheck
              run: npm run typecheck
            - name: Test
              run: npm test
            - name: Build
              run: npm run build
